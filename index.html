<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURE ODDS ARENA - Daily Booking Codes & VIP Odds</title>
    <!-- Paystack SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-xl: 18px;
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 20px;
            margin-bottom: 30px;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            color: #fff;
            text-decoration: none;
        }

        .logo-badge {
            background: var(--primary-emerald);
            color: #000;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            font-size: 1rem;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-emerald);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-emerald);
            box-shadow: 0 0 8px var(--primary-emerald);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .btn-admin {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-admin:hover {
            background: #334155;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 550px;
            margin: 0 auto;
        }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-vip {
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .bookmaker {
            background: #1e293b;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tag-vip {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .tag-free {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-emerald);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .odds-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
        }

        .matches-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .code-box {
            background: #020617;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-action {
            width: 100%;
            background: var(--primary-emerald);
            color: #020617;
            font-weight: 800;
            padding: 14px;
            border-radius: var(--radius-lg);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-vip-action {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: 900;
            padding: 14px;
            border-radius: var(--radius-lg);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-action:hover, .btn-vip-action:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="nav-content">
            <a href="#" class="logo">
                <span class="logo-badge">SOA</span>
                <span>SURE ODDS ARENA</span>
            </a>
            <div class="badge-live"><span class="dot"></span> MoMo Auto-Unlock</div>
            <button class="btn-admin" onclick="openAdmin()">Admin Portal</button>
        </div>
    </header>

    <div class="app-container">
        <div class="hero">
            <h1>TODAY'S BOOKING CODES</h1>
            <p>FREE & HIGH ODDS VIP TICKETS</p>
        </div>

        <!-- Dynamic Grid Container -->
        <div id="tipsContainer" class="grid">
            <p style="text-align:center; color:var(--text-muted); grid-column:1/-1; padding: 40px 0;">Loading today's sure odds...</p>
        </div>
    </div>

<script>
    // Live Render API Base URL
    const API_BASE_URL = 'https://sureoddsarena.onrender.com';
    
    // REPLACE WITH YOUR LIVE PAYSTACK PUBLIC KEY WHEN GOING LIVE
    const PAYSTACK_PUBLIC_KEY = 'pk_live_YOUR_PAYSTACK_PUBLIC_KEY_HERE';

    // Helper to switch base URL for local development vs live Render
    function getApiUrl(endpoint) {
        return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? `${API_BASE_URL}${endpoint}` 
            : endpoint;
    }

    // Load Tips from Server and Render Cards
    async function loadHomeTips() {
        const container = document.getElementById('tipsContainer'); 
        if (!container) return;

        try {
            const response = await fetch(getApiUrl('/api/tips'));
            const tips = await response.json();

            if (!Array.isArray(tips) || tips.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; grid-column:1/-1; padding:40px 0;">No booking codes available today. Check back soon!</p>';
                return;
            }

            container.innerHTML = tips.map(function(tip) {
                const isVip = tip.type === 'vip' || tip.isVip || false;
                const tipId = tip._id || tip.id || '';
                const price = tip.price || 20; 
                const bookmaker = tip.bookmaker || 'SPORTYBET';
                const matches = tip.matchesCount || 'Matches Included';
                const odds = tip.odds || '1.00';
                const code = tip.code || 'N/A';

                return `
                    <div class="card ${isVip ? 'card-vip' : ''}">
                        <div>
                            <div class="card-header">
                                <span class="bookmaker">${bookmaker}</span>
                                <span class="${isVip ? 'tag-vip' : 'tag-free'}">
                                    ${isVip ? 'HIGH ODDS VIP' : 'FREE TICKET'}
                                </span>
                            </div>
                            <div class="odds-val">${odds} <span style="font-size:1rem; color:var(--text-muted); font-weight:600;">ODDS</span></div>
                            <div class="matches-text">📌 ${matches} • Today</div>
                        </div>
                        
                        <div>
                            ${isVip ? `
                                <button class="btn-vip-action" onclick="payWithMoMo('${tipId}',${price})">
                                    🔒 Unlock Code for ${price} GHS
                                </button>
                            ` : `
                                <div class="code-box">
                                    <div>
                                        <div style="font-size:0.7rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">BOOKING CODE</div>
                                        <div style="font-family:monospace; font-weight:900; font-size:1.2rem; color:var(--primary-emerald); letter-spacing:1px;">${code}</div>
                                    </div>
                                    <button style="background:#1e293b; border:1px solid var(--card-border); color:#fff; padding:8px 12px; border-radius:var(--radius-md); cursor:pointer; font-weight:700; font-size:0.8rem;" onclick="copyCode('${code}')">Copy 📋</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

        } catch (err) {
            console.error('Failed to load home tips:', err);
            container.innerHTML = '<p style="color:#ef4444; text-align:center; grid-column:1/-1; padding:40px 0;">Unable to connect to live server. Please refresh in a moment.</p>';
        }
    }

    // Direct MoMo Payment Handler (MTN Mobile Money & Telecel Cash)
    async function payWithMoMo(ticketId, price) {
        const phone = prompt("Enter your Mobile Money Number (MTN / Telecel Cash):");
        
        if (!phone || phone.trim().length < 9) {
            alert("Please enter a valid MoMo phone number to proceed.");
            return;
        }

        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const silentEmail = 'momo_' + cleanPhone + '@sureoddsarena.com';

        try {
            const initUrl = getApiUrl('/api/paystack/initialize');
            const res = await fetch(initUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: silentEmail,
                    phone: cleanPhone,
                    amount: price,
                    ticketId: ticketId
                })
            });

            const initData = await res.json();

            if (!initData.status) {
                alert('Could not start payment: ' + (initData.error || initData.message || 'Server error'));
                return;
            }

            if (typeof PaystackPop === 'undefined') {
                alert('Paystack SDK failed to load. Please check your internet connection.');
                return;
            }

            const handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: silentEmail,
                amount: Math.round(price * 100),
                currency: 'GHS',
                ref: initData.data.reference,
                channels: ['mobile_money'],
                phone: cleanPhone,
                onClose: function() {
                    alert('Payment cancelled.');
                },
                callback: function(response) {
                    verifyPayment(response.reference, ticketId);
                }
            });

            handler.openIframe();

        } catch (err) {
            console.error('Payment initialization error:', err);
            alert('Failed to connect to payment server. Try again.');
        }
    }

    // Verify Payment with Server
    async function verifyPayment(reference, ticketId) {
        try {
            const verifyUrl = getApiUrl('/api/paystack/verify/' + reference);
            const res = await fetch(verifyUrl);
            const data = await res.json();
            
            if (data.status === 'success') {
                alert('Payment successful! Booking code unlocked.');
                location.reload(); 
            } else {
                alert('Payment verification failed.');
            }
        } catch (err) {
            console.error('Payment verification error:', err);
            alert('Error verifying transaction.');
        }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadHomeTips);

    // Canvas Particle Network Background Animation
    const canvas = document.getElementById('bgCanvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // Utility Actions
    function copyCode(code) {
        navigator.clipboard.writeText(code);
        alert('Booking code ' + code + ' copied to clipboard!');
    }

    function openAdmin() {
        window.location.href = 'admin.html';
    }
</script>
</body>
</html>
