<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetCodesPro - Daily Booking Codes & VIP Odds</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-xl: 18px;
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 20px;
            margin-bottom: 30px;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            background: var(--primary-emerald);
            color: #000;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            font-size: 1rem;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-emerald);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-emerald);
            box-shadow: 0 0 8px var(--primary-emerald);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .btn-admin {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background: #334155;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 550px;
            margin: 0 auto;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            backdrop-filter: blur(8px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-vip {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 30px -10px var(--emerald-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .bookmaker {
            background: #1e293b;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tag-vip {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .tag-free {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-emerald);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .odds-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
        }

        .code-box {
            background: #020617;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
        }

        .btn-action {
            width: 100%;
            background: var(--primary-emerald);
            color: #020617;
            font-weight: 800;
            padding: 14px;
            border-radius: var(--radius-lg);
            border: none;
            cursor: pointer;
            margin-top: 16px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            max-width: 400px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            background: #020617;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            color: #fff;
            margin-top: 8px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-emerald);
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="nav-content">
            <div class="logo">
                <span class="logo-badge">SOA</span>
                <span>SURE ODDS ARENA<span style="color:var(--primary-emerald);"></span></span>
            </div>
            <div class="badge-live"><span class="dot"></span> MoMo Auto-Unlock</div>
            <button class="btn-admin" onclick="openAdmin()">Admin Portal</button>
        </div>
    </header>

    <div class="app-container">
        <div class="hero">
            <h1>TODAY'S BOOKING CODES</h1>
            <p>FREE & HIGH ODDS VIP TICKETS</p>
        </div>

        <!-- This MUST be inside your index.html body -->
<div id="tipsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Dynamic tips will load here automatically -->
</div>
    </div>

    <!-- MoMo Payment Modal -->
    <div class="modal-overlay" id="payModal">
        <div class="modal">
            <h3 style="margin-bottom:12px;">Unlock VIP Code</h3>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">Enter your Mobile Money number to complete payment via Paystack.</p>
            <label style="font-size:0.75rem; color:var(--text-muted);">MOMO NUMBER</label>
            <input type="text" placeholder="024 XXX XXXX">
            <button class="btn-action" onclick="alert('Paystack MoMo trigger simulated successfully!')">Pay via Paystack</button>
            <button style="width:100%; background:none; border:none; color:var(--text-muted); margin-top:12px; cursor:pointer;" onclick="closeModal()">Cancel</button>
        </div>
    </div>
<!-- Include Paystack Inline JS in your <head> if it's not there yet: -->
<!-- <script src="https://js.paystack.co/v1/inline.js"></script> -->

<script>
    // Live Render API Base URL
    const API_BASE_URL = 'https://sureoddsarena.onrender.com';
    
    // REPLACE WITH YOUR LIVE PAYSTACK PUBLIC KEY
    const PAYSTACK_PUBLIC_KEY = 'pk_live_YOUR_PAYSTACK_PUBLIC_KEY_HERE';

    // Helper to get relative or full backend URL
    function getApiUrl(endpoint) {
        return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? `${API_BASE_URL}${endpoint}` 
            : endpoint;
    }

    // Load Tips from Server
async function loadHomeTips() {
    const container = document.getElementById('tipsContainer'); 
    if (!container) return;

    // Live Render API Base URL
    const PRODUCTION_API_URL = 'https://sureoddsarena.onrender.com';
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:5002/api/tips'
        : `${PRODUCTION_API_URL}/api/tips`;

    try {
        const response = await fetch(API_URL);
        const tips = await response.json();

        if (!Array.isArray(tips) || tips.length === 0) {
            container.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10 font-medium">No booking codes available today. Check back soon!</p>';
            return;
        }

        container.innerHTML = tips.map(function(tip) {
            const isVip = tip.type === 'vip' || tip.isVip || false;
            const tipId = tip._id || tip.id || '';
            const price = tip.price || 20; 
            const bookmaker = tip.bookmaker || 'SPORTYBET';
            const matches = tip.matchesCount || 'Matches Included';
            const odds = tip.odds || '1.00';
            const code = tip.code || 'N/A';

            return `
                <div class="bg-slate-900/90 border ${isVip ? 'border-amber-500/50 shadow-amber-500/10' : 'border-slate-800'} rounded-2xl p-5 shadow-xl flex flex-col justify-between relative overflow-hidden">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-black text-white uppercase bg-slate-800 px-3 py-1 rounded-md border border-slate-700 tracking-wider">
                                ${bookmaker}
                            </span>
                            <span class="text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-wider ${isVip ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'}">
                                ${isVip ? 'HIGH ODDS VIP' : 'FREE TICKET'}
                            </span>
                        </div>

                        <div class="text-3xl font-black text-white mb-1">
                            ${odds} <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">ODDS</span>
                        </div>
                        <div class="text-xs text-slate-400 font-semibold mb-5 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full ${isVip ? 'bg-amber-400' : 'bg-emerald-400'}"></span>
                            ${matches}
                        </div>
                    </div>

                    <div class="mt-2">
                        ${isVip ? `
                            <button onclick="payWithMoMo('${tipId}',${price})" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
                                🔒 Unlock Code for ${price} GHS
                            </button>
                        ` : `
                            <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase">Booking Code</div>
                                    <div class="font-mono text-lg font-black text-emerald-400 tracking-widest">${code}</div>
                                </div>
                                <button onclick="copyCode('${code}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition font-bold">
                                    Copy 📋
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error('Failed to load home tips:', err);
        container.innerHTML = '<p class="col-span-full text-center text-red-400 py-10 font-bold">Unable to connect to live server.</p>';
    }
}

document.addEventListener('DOMContentLoaded', loadHomeTips);
    // Direct MoMo Payment Handler (MTN Mobile Money & Telecel Cash)
    async function payWithMoMo(ticketId, price) {
        // Prompt user ONLY for their Mobile Money phone number
        const phone = prompt("Enter your Mobile Money Number (MTN / Telecel Cash):");
        
        if (!phone || phone.trim().length < 9) {
            alert("Please enter a valid MoMo phone number to proceed.");
            return;
        }

        const cleanPhone = phone.replace(/[^0-9]/g, '');
        // Silent background email (User never sees an email prompt)
        const silentEmail = 'momo_' + cleanPhone + '@sureoddsarena.com';

        try {
            // 1. Initialize Paystack transaction on Render backend
            const initUrl = getApiUrl('/api/paystack/initialize');
            const res = await fetch(initUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: silentEmail,
                    phone: cleanPhone,
                    amount: price,
                    ticketId: ticketId
                })
            });

            const initData = await res.json();

            if (!initData.status) {
                alert('Could not start payment: ' + (initData.error || initData.message || 'Server error'));
                return;
            }

            // Check if Paystack Inline SDK is loaded
            if (typeof PaystackPop === 'undefined') {
                alert('Paystack SDK failed to load. Please ensure https://js.paystack.co/v1/inline.js is included in your <head>.');
                return;
            }

            // 2. Open Paystack MoMo Modal
            const handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: silentEmail,
                amount: Math.round(price * 100), // Pesewas conversion
                currency: 'GHS',
                ref: initData.data.reference,
                channels: ['mobile_money'],
                phone: cleanPhone,
                onClose: function() {
                    alert('Payment cancelled.');
                },
                callback: function(response) {
                    // 3. Verify reference on Render server upon PIN entry
                    verifyPayment(response.reference, ticketId);
                }
            });

            handler.openIframe();

        } catch (err) {
            console.error('Payment initialization error:', err);
            alert('Failed to connect to payment server. Try again.');
        }
    }

    // Verify Payment with Server
    async function verifyPayment(reference, ticketId) {
        try {
            const verifyUrl = getApiUrl('/api/paystack/verify/' + reference);
            const res = await fetch(verifyUrl);
            const data = await res.json();

            if (data.status === 'success') {
                alert('Payment successful! Booking code unlocked.');
                location.reload(); // Refresh page to display unlocked VIP tip
            } else {
                alert('Payment verification failed.');
            }
        } catch (err) {
            console.error('Payment verification error:', err);
            alert('Error verifying transaction.');
        }
    }

    // Run on page load
    window.addEventListener('DOMContentLoaded', loadHomeTips);

    // Canvas Particle Network Animation
    const canvas = document.getElementById('bgCanvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.4)';
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // UI Interactions
    function copyCode(code) {
        navigator.clipboard.writeText(code);
        alert('Booking code ' + code + ' copied to clipboard!');
    }

    function openAdmin() {
        window.location.href = 'admin.html';
    }
</script>
</body>
</html>
