<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURE ODDS ARENA - Admin Portal</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-color: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-xl: 18px;
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .admin-container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; display: none; }
        .admin-container.unlocked { display: block; }

        /* Lock Screen Overlay */
        .lock-overlay {
            position: fixed;
            inset: 0;
            background: rgba(7, 9, 14, 0.95);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lock-overlay.hidden { display: none; }

        .lock-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            backdrop-filter: blur(8px);
        }

        .logo-text { font-weight: 900; font-size: 1.2rem; color: #fff; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-action { background: #1e293b; color: #fff; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: var(--radius-md); text-decoration: none; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .btn-lock { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        .admin-card h3 { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; }
        .form-input, .form-select { width: 100%; background: #020617; border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 11px; color: #fff; font-size: 0.9rem; outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--primary-color); }

        .btn-submit { width: 100%; background: var(--primary-color); color: #020617; font-weight: 900; padding: 12px; border-radius: var(--radius-md); border: none; cursor: pointer; font-size: 0.95rem; margin-top: 10px; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.9; }

        .tips-list-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-xl); padding: 24px; backdrop-filter: blur(8px); }
        .tip-item { background: #020617; border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tip-info h4 { font-size: 0.95rem; font-weight: 800; color: #fff; }
        .tip-info p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #34d399; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- Admin Password Lock Screen -->
    <div id="lockOverlay" class="lock-overlay">
        <div class="lock-box">
            <h2 style="color:#fff; font-size:1.4rem; margin-bottom:6px;">🔒 Admin Locked</h2>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">Enter your secret admin password to access the portal.</p>
            <form onsubmit="unlockAdmin(event)">
                <input type="password" id="adminPasswordInput" class="form-input" placeholder="Enter admin password" style="margin-bottom:14px;" required>
                <button type="submit" class="btn-submit">Unlock Portal</button>
            </form>
            <a href="index.html" style="display:block; margin-top:15px; color:var(--text-muted); font-size:0.8rem; text-decoration:none;">← Return to Home</a>
        </div>
    </div>

    <!-- Main Admin Container (Hidden until unlocked) -->
    <div id="adminContainer" class="admin-container">
        <header>
            <div class="logo-text">⚡ SOA Admin Control Panel</div>
            <div class="header-actions">
                <a href="index.html" class="btn-action">⬅ Home</a>
                <button onclick="lockAdmin()" class="btn-action btn-lock">🔒 Lock Admin</button>
            </div>
        </header>

        <div class="admin-grid">
            <div class="admin-card">
                <h3>📌 Publish Booking Code</h3>
                <form id="tipForm" onsubmit="createTip(event)">
                    <div class="form-group">
                        <label class="form-label">Bookmaker</label>
                        <select id="bookmaker" class="form-select">
                            <option value="SPORTYBET">SportyBet</option>
                            <option value="1XBET">1xBet</option>
                            <option value="BETWAY">Betway</option>
                            <option value="PARIMATCH">Parimatch</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ticket Type</label>
                        <select id="tipType" class="form-select" onchange="togglePriceField()">
                            <option value="free">Free Ticket</option>
                            <option value="vip">High Odds VIP</option>
                        </select>
                    </div>
                    <div class="form-group" id="priceGroup" style="display:none;">
                        <label class="form-label">VIP Price (GHS)</label>
                        <input type="number" id="price" class="form-input" value="20">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Total Odds</label>
                        <input type="text" id="odds" class="form-input" placeholder="e.g. 15.40" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Matches Info</label>
                        <input type="text" id="matchesCount" class="form-input" placeholder="e.g. 5 Matches" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Booking Code</label>
                        <input type="text" id="code" class="form-input" placeholder="e.g. JGHF6" required>
                    </div>
                    <button type="submit" class="btn-submit">Publish Code</button>
                </form>
            </div>

            <div class="admin-card">
                <h3>⚙️ Global Platform Settings</h3>
                <form id="settingsForm" onsubmit="saveSettings(event)">
                    <div class="form-group">
                        <label class="form-label">Countdown Timer Duration (Hours)</label>
                        <input type="number" id="timerHours" class="form-input" value="3" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Announcement Ticker Text</label>
                        <input type="text" id="announcementText" class="form-input" value="🔥 New VIP Slips dropping daily at 4 PM GMT!">
                    </div>
                    <button type="submit" class="btn-submit" style="background:#3b82f6; color:#fff;">Save Settings</button>
                </form>
            </div>
        </div>

        <div class="tips-list-card">
            <h3>📊 Active Published Tickets</h3>
            <div id="adminTipsList" style="margin-top: 14px;">
                <p style="color:var(--text-muted); font-size:0.85rem;">Loading active tickets...</p>
            </div>
        </div>
    </div>

<script>
    const API_BASE_URL = 'https://sureoddsarena.onrender.com';
    const ADMIN_SECRET_PASSWORD = 'admin123'; // <--- CHANGE THIS TO YOUR OWN PASSWORD

    function getApiUrl(endpoint) {
        return (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? `${API_BASE_URL}${endpoint}` : endpoint;
    }

    // Security Unlock / Lock Functions
    function unlockAdmin(e) {
        e.preventDefault();
        const pass = document.getElementById('adminPasswordInput').value;
        if (pass === ADMIN_SECRET_PASSWORD) {
            sessionStorage.setItem('soa_admin_logged', 'true');
            document.getElementById('lockOverlay').classList.add('hidden');
            document.getElementById('adminContainer').classList.add('unlocked');
            fetchAdminTips();
        } else {
            alert('Incorrect admin password!');
            document.getElementById('adminPasswordInput').value = '';
        }
    }

    function lockAdmin() {
        sessionStorage.removeItem('soa_admin_logged');
        document.getElementById('lockOverlay').classList.remove('hidden');
        document.getElementById('adminContainer').classList.remove('unlocked');
        document.getElementById('adminPasswordInput').value = '';
    }

    // Check login state on page load
    document.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('soa_admin_logged') === 'true') {
            document.getElementById('lockOverlay').classList.add('hidden');
            document.getElementById('adminContainer').classList.add('unlocked');
            fetchAdminTips();
        }

        if (localStorage.getItem('soa_timer_hours')) {
            document.getElementById('timerHours').value = localStorage.getItem('soa_timer_hours');
        }
        if (localStorage.getItem('soa_announcement')) {
            document.getElementById('announcementText').value = localStorage.getItem('soa_announcement');
        }
    });

    const canvas = document.getElementById('bgCanvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        for (let i = 0; i < 40; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5 });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    function togglePriceField() {
        const type = document.getElementById('tipType').value;
        document.getElementById('priceGroup').style.display = (type === 'vip') ? 'block' : 'none';
    }

    async function fetchAdminTips() {
        const container = document.getElementById('adminTipsList');
        try {
            const res = await fetch(getApiUrl('/api/tips'));
            const tips = await res.json();
            if (!Array.isArray(tips) || tips.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">No active codes right now.</p>';
                return;
            }
            container.innerHTML = tips.map(tip => `
                <div class="tip-item">
                    <div class="tip-info">
                        <h4>${tip.bookmaker || 'SPORTYBET'} — ${tip.odds} Odds (${(tip.type || 'free').toUpperCase()}) ${tip.won ? '✅ [WON]' : ''}</h4>
                        <p>Code: <b>${tip.code || 'N/A'}</b> | Matches: ${tip.matchesCount || 'N/A'}</p>
                    </div>
                    <div class="action-btns">
                        ${!tip.won ? `<button class="btn-win" onclick="markAsWon('${tip._id || tip.id}')">Mark Won ✅</button>` : '<span style="color:#34d399; font-weight:800; font-size:0.75rem; padding:6px 10px;">WON</span>'}
                        <button class="btn-del" onclick="deleteTip('${tip._id || tip.id}')">Delete 🗑️</button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            container.innerHTML = '<p style="color:#ef4444; font-size:0.85rem;">Failed to load tips.</p>';
        }
    }

    async function createTip(e) {
        e.preventDefault();
        const payload = {
            bookmaker: document.getElementById('bookmaker').value,
            type: document.getElementById('tipType').value,
            price: document.getElementById('price').value,
            odds: document.getElementById('odds').value,
            matchesCount: document.getElementById('matchesCount').value,
            code: document.getElementById('code').value,
            won: false
        };
        try {
            const res = await fetch(getApiUrl('/api/tips'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Booking code published successfully!');
                document.getElementById('tipForm').reset();
                togglePriceField();
                fetchAdminTips();
            } else { alert('Failed to publish code.'); }
        } catch (err) { alert('Server error connecting to backend.'); }
    }

    async function deleteTip(id) {
        if (!confirm("Are you sure you want to delete this code?")) return;
        try {
            await fetch(getApiUrl('/api/tips/' + id), { method: 'DELETE' });
            fetchAdminTips();
        } catch (err) { alert('Error deleting tip.'); }
    }

    async function markAsWon(id) {
        try {
            const res = await fetch(getApiUrl('/api/tips/' + id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ won: true })
            });
            if (res.ok) {
                alert('Tip marked as WON!');
                fetchAdminTips();
            } else { alert('Failed to update status.'); }
        } catch (err) { alert('Error updating status.'); }
    }

    function saveSettings(e) {
        e.preventDefault();
        const hours = parseInt(document.getElementById('timerHours').value) || 3;
        const announcement = document.getElementById('announcementText').value;
        const targetTime = new Date().getTime() + (hours * 3600 * 1000);
        localStorage.setItem('soa_countdown_target', targetTime);
        localStorage.setItem('soa_timer_hours', hours);
        localStorage.setItem('soa_announcement', announcement);
        alert('Settings saved!');
    }
</script>
</body>
</html>
